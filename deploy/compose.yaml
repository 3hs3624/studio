name: studio-access
services:
  database:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Run configure.py first}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Run configure.py first}
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-database.sql:/docker-entrypoint-initdb.d/10-application-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_owner -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: studio-local-access:latest
    build:
      context: ..
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: .env
    environment:
      DEBUG: '0'
      AUTH_MODE: local
      DB_ENGINE: postgresql
      DB_NAME: studio
      DB_USER: studio
      DB_HOST: database
      TRUST_PROXY_HEADERS: '1'
    volumes: ["./access:/run/access", "static:/app/staticfiles"]
    depends_on:
      database: {condition: service_healthy}
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py bootstrap_local_access --credential-file /run/access/temporary-accounts.json && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile - --error-logfile -"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/login/',headers={'Host': __import__('os').environ['APP_HOST'], 'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-localhost}
      EXTERNAL_HTTPS_PORT: ${HTTPS_PORT:-8443}
      NO_PROXY: web,database,localhost,127.0.0.1
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
volumes:
  database:
    name: studio-access_database_secure
  static:
  caddy_data:
  caddy_config:
