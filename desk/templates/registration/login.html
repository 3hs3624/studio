{% extends 'desk/base.html' %}{% block title %}로그인 · Studio{% endblock %}{% block content %}
<div class="login-card"><p class="eyebrow">INTEGRATED IT OPERATIONS</p><h1>Studio에 로그인</h1><p class="muted">IT서비스 · IT자산 · IT자원을 하나의 계정으로 이용하세요.</p>
{% if form.errors %}<div class="error" role="alert">아이디와 비밀번호를 확인하십시오.</div>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
<label for="id_username">아이디</label><input id="id_username" name="username" autocomplete="username" required autofocus>
<label for="id_password">비밀번호</label><input id="id_password" type="password" name="password" autocomplete="current-password" required>
<button class="primary full" type="submit">로그인 →</button></form></div>{% endblock %}
