<label class="screen-field{% if field.span %} screen-span-{{ field.span }} screen-height-{{ field.height }}{% endif %}">{{ field.label }}{% if field.required %} *{% endif %}{% if field.read_only %}<span class="process-readonly">{% if field.type == 'person' %}{{ field.display_value }}{% else %}{{ field.value|default_if_none:'—' }}{% endif %}</span>{% elif field.type == 'person' %}<select data-process-input="{{ field.key }}" data-process-type="person" {% if field.required %}required{% endif %}><option value="">담당자 선택</option>{% for option in field.options %}<option value="{{ option.id }}" {% if option.id == field.value %}selected{% endif %}>{{ option.name }}</option>{% endfor %}</select>{% elif field.type == 'boolean' %}<select data-process-input="{{ field.key }}" data-process-type="boolean" {% if field.required %}required{% endif %}><option value="">선택</option><option value="true" {% if field.value == True %}selected{% endif %}>예</option><option value="false" {% if field.value == False %}selected{% endif %}>아니오</option></select>{% elif field.type == 'textarea' or field.type == 'json' or field.type == 'entityset' %}<textarea data-process-input="{{ field.key }}" data-process-type="{{ field.type }}" maxlength="{{ field.max_length|default:65535 }}" {% if field.required %}required{% endif %}>{{ field.display_json|default:field.value }}</textarea>{% else %}<input data-process-input="{{ field.key }}" data-process-type="{{ field.type }}" type="{% if field.type == 'number' or field.type == 'integer' %}number{% elif field.type == 'date' or field.type == 'time' or field.type == 'month' or field.type == 'email' or field.type == 'url' %}{{ field.type }}{% else %}text{% endif %}" step="{% if field.type == 'integer' %}1{% else %}any{% endif %}" value="{{ field.value }}" maxlength="{{ field.max_length|default:2000 }}" {% if field.required %}required{% endif %}>{% endif %}</label>
