<div class="screen-field{% if f.span %} screen-span-{{ f.span }} screen-height-{{ f.height }}{% endif %}"><label for="field-{{ f.key }}">{{ f.label }} {% if f.required %}<span class="required">*</span>{% endif %}</label>
{% if f.type == 'textarea' %}<textarea id="field-{{ f.key }}" data-answer="{{ f.key }}" data-answer-type="{{ f.type }}" maxlength="{{ f.max_length|default:4000 }}" rows="5" {% if f.required %}required{% endif %}>{{ f.value }}</textarea>
{% elif f.type == 'choice' %}<select id="field-{{ f.key }}" data-answer="{{ f.key }}" data-answer-type="{{ f.type }}" {% if f.required %}required{% endif %}><option value="">선택하십시오.</option>{% for choice in f.options %}<option {% if choice == f.value %}selected{% endif %}>{{ choice }}</option>{% endfor %}</select>
{% elif f.type == 'boolean' %}<select id="field-{{ f.key }}" data-answer="{{ f.key }}" data-answer-type="{{ f.type }}" {% if f.required %}required{% endif %}><option value="">선택하십시오.</option><option value="true" {% if f.value == True %}selected{% endif %}>예</option><option value="false" {% if f.value == False %}selected{% endif %}>아니오</option></select>
{% else %}<input id="field-{{ f.key }}" data-answer="{{ f.key }}" data-answer-type="{{ f.type }}" type="{% if f.type == 'integer' %}number{% elif f.type == 'date' %}date{% else %}text{% endif %}" value="{{ f.value }}" {% if f.type == 'integer' %}min="{{ f.minimum|default:'-1000000000' }}" max="{{ f.maximum|default:'1000000000' }}" step="1"{% endif %} maxlength="{{ f.max_length|default:2000 }}" {% if f.required %}required{% endif %}>{% endif %}
</div>
