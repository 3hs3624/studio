<div class="process-form-grid columns-{{ columns|default:2 }}">{% for field in fields %}<label>{{ field.label }}{% if field.required %} *{% endif %}{% if field.read_only %}<span class="process-readonly">{% if field.type == 'person' %}{{ field.display_value }}{% else %}{{ field.value|default_if_none:'—' }}{% endif %}</span>{% elif field.type == 'person' %}<select data-process-input="{{ field.key }}" data-process-type="person" {% if field.required %}required{% endif %}><option value="">담당자 선택</option>{% for option in field.options %}<option value="{{ option.id }}" {% if option.id == field.value %}selected{% endif %}>{{ option.name }}</option>{% endfor %}</select>{% elif field.type == 'boolean' %}<select data-process-input="{{ field.key }}" data-process-type="boolean" {% if field.required %}required{% endif %}><option value="">선택</option><option value="true" {% if field.value == True %}selected{% endif %}>예</option><option value="false" {% if field.value == False %}selected{% endif %}>아니오</option></select>{% else %}<input data-process-input="{{ field.key }}" data-process-type="{{ field.type }}" type="{% if field.type == 'number' %}number{% else %}text{% endif %}" step="any" value="{{ field.value }}" maxlength="2000" {% if field.required %}required{% endif %}>{% endif %}</label>{% endfor %}</div>
