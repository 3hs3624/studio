<div class="process-form-grid columns-{{ columns|default:2 }}">{% for field in fields %}<label>{{ field.label }}{% if field.required %} *{% endif %}{% if field.read_only %}<span class="process-readonly">{{ field.value|default_if_none:'—' }}</span>{% elif field.type == 'boolean' %}<select data-process-input="{{ field.key }}" data-process-type="boolean" {% if field.required %}required{% endif %}><option value="">선택</option><option value="true" {% if field.value == True %}selected{% endif %}>예</option><option value="false" {% if field.value == False %}selected{% endif %}>아니오</option></select>{% else %}<input data-process-input="{{ field.key }}" data-process-type="{{ field.type }}" type="{% if field.type == 'number' %}number{% else %}text{% endif %}" step="any" value="{{ field.value }}" maxlength="2000" {% if field.required %}required{% endif %}>{% endif %}</label>{% endfor %}</div>
