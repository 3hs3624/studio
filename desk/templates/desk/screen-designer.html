<dialog id="screen-designer" aria-labelledby="screen-designer-title">
<header class="designer-toolbar"><h2 id="screen-designer-title">화면 디자이너</h2><label>그룹 표시<select data-designer-mode><option value="sections">그룹 나열</option><option value="tabs">탭</option></select></label><label>열 수<select data-designer-columns><option>1</option><option>2</option><option>3</option></select></label><button type="button" class="secondary" data-designer-undo>실행 취소</button><button type="button" class="secondary" data-designer-redo>다시 실행</button><button type="button" class="secondary" data-designer-mobile>모바일 미리보기</button><button type="button" class="secondary" data-designer-cancel>취소·닫기</button><button type="button" class="primary" data-designer-apply>화면 항목에 적용</button></header>
<p class="designer-help">필드를 끌어 그룹 안·그룹 사이로 이동하고 오른쪽 아래 핸들로 크기를 조정합니다. 우클릭 또는 속성 버튼으로 편집합니다. 키보드: Ctrl+방향키 이동, Shift+방향키 크기 조정, Shift+F10 속성.</p><p class="error" data-designer-error hidden role="alert"></p>
<div class="designer-workspace"><aside class="designer-palette"><h3>필드 추가</h3><button type="button" class="secondary" data-designer-add="text">문자 필드</button><button type="button" class="secondary" data-designer-add="number">숫자 필드</button><button type="button" class="secondary" data-designer-add="boolean">예·아니오</button><button type="button" class="secondary" data-designer-add="person">담당자 선택</button><h3>그룹</h3><button type="button" class="secondary" data-designer-add-group>그룹 추가</button><div data-designer-group-list></div></aside>
<div class="designer-stage"><div data-designer-canvas></div></div>
<aside class="designer-properties"><h3>선택한 그룹</h3><label>그룹 이름<input data-designer-group-name maxlength="100"></label><button type="button" class="secondary" data-designer-remove-group>그룹 삭제·필드 이동</button><h3>선택한 필드</h3><p data-designer-selection>필드를 선택하십시오.</p><button type="button" class="secondary" data-designer-properties>필드 속성</button><button type="button" class="secondary" data-designer-up>앞으로 이동</button><button type="button" class="secondary" data-designer-down>뒤로 이동</button><button type="button" class="secondary" data-designer-delete>필드 삭제</button><p>적용 후 기존 화면에서 ‘초안 저장·검증’을 실행하십시오. 게시 전에는 진행 중인 업무에 적용되지 않습니다.</p></aside></div>
</dialog>
<dialog id="screen-field-properties" aria-labelledby="screen-field-properties-title"><form><h2 id="screen-field-properties-title">필드 속성</h2><p class="error" data-property-error hidden role="alert"></p><div class="user-create-grid"><label>식별자<input name="key" pattern="[a-z][a-z0-9_]{0,39}" maxlength="40" required></label><label>표시 이름<input name="label" maxlength="100" required></label><label>유형<select name="type"><option value="text">문자</option><option value="number">숫자</option><option value="boolean">예·아니오</option><option value="person">담당자</option></select></label><label>배치 그룹<select name="group"></select></label><label>너비 · 차지할 열 수<input type="number" name="span" min="1" max="3" required></label><label>높이 · 48px 단위<input type="number" name="height" min="1" max="5" required></label><label>담당자 선택 범위<select name="group_id"></select></label><label class="check"><input type="checkbox" name="required">필수 입력</label><label class="check"><input type="checkbox" name="readonly">조회 전용</label></div><div class="designer-actions"><button type="button" class="secondary" data-property-cancel>취소</button><button class="primary" type="submit">속성 적용</button></div></form></dialog>
<p class="muted" data-designer-applied role="status" hidden></p>
